name: Android

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'sample-ios/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ApiSurface.kt exercises the full public API, so building both variants is the core x noop parity test.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # buildSrc holds the rule that turns VERSION_NAME into the desktop installer version (DEB-70): pure Kotlin, so cheap here.
      - name: Unit tests (core, noop, build logic) and version check
        run: ./gradlew :core:testDebugUnitTest :bugsy-noop:testDebugUnitTest :buildSrc:test :bugsy-desktop:verifyVersions

      - name: Build Android sample (debug + release)
        run: ./gradlew :sample-android:assembleDebug :sample-android:assembleRelease

      - name: Release gate (no instrumentation in the release APK)
        run: ./scripts/check-release-clean.sh --apk sample-android/build/outputs/apk/release/sample-android-release-unsigned.apk
