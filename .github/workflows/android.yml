name: Android

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Android + JVM on Linux: tests, both sample variants (debug and release), and the release APK gate.
  # ApiSurface.kt exercises the full public API, so building both variants is the core x noop parity test.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core, noop)
        run: ./gradlew :core:testDebugUnitTest :bugsy-noop:testDebugUnitTest

      - name: Build Android sample (debug + release)
        run: ./gradlew :sample-android:assembleDebug :sample-android:assembleRelease

      - name: Release gate (no instrumentation in the release APK)
        run: ./scripts/check-release-clean.sh sample-android/build/outputs/apk/release/sample-android-release-unsigned.apk

      - name: Test coverage (Kover, core + ui)
        run: ./gradlew :ui:testDebugUnitTest :koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
