name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-release-gate:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Testes das duas plataformas + snapshots de UI.
      - name: Unit tests, iOS simulator tests and snapshot verification
        run: ./gradlew :core:testDebugUnitTest :core:iosSimulatorArm64Test :bugsy-noop:testDebugUnitTest :bugsy-noop:iosSimulatorArm64Test :ui:testDebugUnitTest :ui:iosSimulatorArm64Test :ui:verifyPaparazziDebug

      # Compila as DUAS variantes do sample: debug contra o Bugsy completo e release contra o bugsy-noop.
      # ApiSurface.kt usa toda a API pública, então este passo é o teste de paridade core x noop.
      - name: Build Android sample (debug + release)
        run: ./gradlew :sample-android:assembleDebug :sample-android:assembleRelease

      - name: Build iOS frameworks and sample (Release)
        run: |
          ./gradlew :ui:linkDebugFrameworkIosSimulatorArm64 :ui:iosSimulatorArm64AggregateResources :bugsy-noop:linkReleaseFrameworkIosSimulatorArm64
          xcodebuild -project sample-ios/BugsySample.xcodeproj -scheme BugsySample -sdk iphonesimulator \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-release build CODE_SIGNING_ALLOWED=NO ARCHS=arm64

      # Gate de release: o APK e o binário iOS de Release não podem ter nenhum rastro da instrumentação.
      - name: Release gate (no instrumentation in release builds)
        run: |
          ./scripts/check-release-clean.sh \
            sample-android/build/outputs/apk/release/sample-android-release-unsigned.apk \
            build/ios-release/Build/Products/Release-iphonesimulator/BugsySample.app/BugsySample

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
