name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Android + JVM em Linux: testes, as duas variantes do sample (debug e release) e o gate de release do APK.
  # ApiSurface.kt usa toda a API pública, então compilar as duas variantes é o teste de paridade core x noop.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core, noop)
        run: ./gradlew :core:testDebugUnitTest :bugsy-noop:testDebugUnitTest

      - name: Build Android sample (debug + release)
        run: ./gradlew :sample-android:assembleDebug :sample-android:assembleRelease

      - name: Release gate (no instrumentation in the release APK)
        run: ./scripts/check-release-clean.sh sample-android/build/outputs/apk/release/sample-android-release-unsigned.apk

  # iOS precisa de macOS: testes dos simuladores, build Release do sample e o gate de release do binário.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: iOS simulator tests
        run: ./gradlew :core:iosSimulatorArm64Test :bugsy-noop:iosSimulatorArm64Test :ui:iosSimulatorArm64Test

      - name: Build iOS frameworks and sample (Release)
        run: |
          ./gradlew :ui:linkDebugFrameworkIosSimulatorArm64 :ui:iosSimulatorArm64AggregateResources :bugsy-noop:linkReleaseFrameworkIosSimulatorArm64
          xcodebuild -project sample-ios/BugsySample.xcodeproj -scheme BugsySample -sdk iphonesimulator \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-release build CODE_SIGNING_ALLOWED=NO ARCHS=arm64

      - name: Release gate (no instrumentation in the iOS release binary)
        run: |
          ./gradlew :sample-android:assembleRelease
          ./scripts/check-release-clean.sh \
            sample-android/build/outputs/apk/release/sample-android-release-unsigned.apk \
            build/ios-release/Build/Products/Release-iphonesimulator/BugsySample.app/BugsySample

  # Snapshots de UI (Paparazzi). As imagens de referência foram gravadas no Mac de desenvolvimento e o texto renderiza
  # com pequenas diferenças no runner; enquanto isso não for resolvido o job não bloqueia o PR e publica as diferenças.
  # Rode localmente: ./gradlew :ui:verifyPaparazziDebug
  snapshots:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify UI snapshots
        run: ./gradlew :ui:testDebugUnitTest :ui:verifyPaparazziDebug

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: ui/build/paparazzi/failures
          if-no-files-found: ignore

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
