name: Desktop build

# Builda o instalador do bugsy-desktop nos três sistemas (sem publicar nada), só
# pra disponibilizar como artifact do workflow e permitir validar manualmente
# uma mudança antes de um release de verdade. Disparo manual ou em PR que toca
# o módulo bugsy-desktop.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bugsy-desktop/**'
      - '.github/workflows/desktop-build.yml'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: packageDmg
            glob: bugsy-desktop/build/compose/binaries/main/dmg/*.dmg
          - os: windows-latest
            task: packageMsi
            glob: bugsy-desktop/build/compose/binaries/main/msi/*.msi
          - os: ubuntu-latest
            task: packageDeb
            glob: bugsy-desktop/build/compose/binaries/main/deb/*.deb
    steps:
      - uses: actions/checkout@v7

      # Gradle itself needs 21 to resolve :ui's buildscript classpath (the Paparazzi plugin
      # requires it); 17 stays installed too so bugsy-desktop's jvmToolchain(17) can find it.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # jpackage needs fakeroot to build a .deb, and it isn't on the ubuntu-latest image.
      - name: Install fakeroot (Linux .deb packaging)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      # jpackage needs the WiX v3 toolset to build an .msi, and it isn't on the windows-latest image.
      - name: Install WiX Toolset (Windows .msi packaging)
        if: matrix.os == 'windows-latest'
        run: choco install wixtoolset -y

      - name: Build installer
        run: ./gradlew :bugsy-desktop:${{ matrix.task }} --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: bugsy-desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}
          retention-days: 7
