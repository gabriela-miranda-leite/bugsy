name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de bump de versão"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: "Sufixo de pre-release opcional (ex: alpha, beta, rc1). Deixe vazio pra uma versão estável."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Restrict who can trigger this release
        if: github.actor != 'gabriela-miranda-leite'
        run: |
          echo "::error::Apenas gabriela-miranda-leite pode disparar um release." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from current VERSION_NAME + bump
        id: compute
        run: |
          current="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          core="${current%%-*}"
          IFS='.' read -r major minor patch <<< "$core"
          if [[ ! "$major.$minor.$patch" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Não consegui parsear a versão atual '$current' (esperava X.Y.Z[-sufixo])." >&2
            exit 1
          fi

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          next="$major.$minor.$patch"
          if [ -n "${{ inputs.prerelease }}" ]; then
            if [[ ! "${{ inputs.prerelease }}" =~ ^[a-zA-Z0-9.]+$ ]]; then
              echo "::error::Sufixo de pre-release inválido: '${{ inputs.prerelease }}'. Use só letras, números e pontos." >&2
              exit 1
            fi
            next="$next-${{ inputs.prerelease }}"
          fi

          if git rev-parse "v$next" >/dev/null 2>&1; then
            echo "::error::Tag v$next já existe." >&2
            exit 1
          fi

          echo "Versão atual: $current -> nova versão (${{ inputs.bump }}): $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  pre-release:
    needs: compute-version
    uses: ./.github/workflows/pre-release.yml

  release:
    needs: [compute-version, pre-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.compute-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump VERSION_NAME in gradle.properties
        run: sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" gradle.properties

      - name: Commit, open PR and merge (main is protected, no direct push)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${VERSION}"
          git add gradle.properties
          git commit -m "chore: release v${VERSION}"
          git push origin "release/v${VERSION}"
          gh pr create --base main --head "release/v${VERSION}" \
            --title "chore: release v${VERSION}" \
            --body "Release automático via workflow_dispatch."
          gh pr merge "release/v${VERSION}" --squash --admin --delete-branch

      - name: Tag and create GitHub Release with auto-generated changelog
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
