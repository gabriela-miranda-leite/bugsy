name: Snapshots

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # UI snapshots (Paparazzi). Blocks the PR when a reference image differs, and publishes the diffs.
  # Run locally: ./gradlew :ui:verifyPaparazziDebug (re-record with :ui:recordPaparazziDebug)
  snapshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify UI snapshots
        run: ./gradlew :ui:testDebugUnitTest :ui:verifyPaparazziDebug

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-failures
          path: ui/build/paparazzi/failures
          if-no-files-found: ignore
