name: Snapshots

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # UI snapshots (Paparazzi). Reference images were recorded on the dev Mac and text renders with small
  # differences on the runner; until that's resolved, the job doesn't block the PR and publishes the diffs.
  # Run locally: ./gradlew :ui:verifyPaparazziDebug
  snapshots:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify UI snapshots
        run: ./gradlew :ui:testDebugUnitTest :ui:verifyPaparazziDebug

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: ui/build/paparazzi/failures
          if-no-files-found: ignore
