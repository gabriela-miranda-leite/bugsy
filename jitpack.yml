jdk:
  - openjdk17

# O JitPack builda em container Linux: só os artefatos Android (:ui, :bugsy-noop) são
# publicáveis aqui. Os targets iOS exigem macOS/Xcode e continuam fora do JitPack —
# a integração iOS é documentada no README como build local via Gradle.
install:
  # :core precisa das publications "raiz" (kotlinMultiplatform) + androidRelease: :ui depende de
  # :core via api(project(":core")), e o Gradle Module Metadata do consumidor só resolve essa
  # dependência transitiva através do redirect "available-at" da publication raiz.
  - ./gradlew :core:publishKotlinMultiplatformPublicationToMavenLocal :core:publishAndroidReleasePublicationToMavenLocal :ui:publishAndroidReleasePublicationToMavenLocal :bugsy-noop:publishAndroidReleasePublicationToMavenLocal
